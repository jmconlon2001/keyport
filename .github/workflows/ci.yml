name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore local tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build Keyport.sln -c Release
      - name: Test
        run: dotnet test Keyport.sln -c Release --no-build --logger "console;verbosity=normal"

  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t keyport:ci .
      - name: Smoke test (starts, serves health, refuses without a master key)
        run: |
          openssl rand -base64 32 > key && chmod 644 key
          docker run -d --name kp -p 8080:8080 -v "$PWD/key:/run/secrets/keyport_master_key:ro" keyport:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health/live && break; sleep 2; done
          curl -sf http://localhost:8080/health/live
          docker logs kp | grep -q "Bootstrap administrator"
          ! docker run --rm keyport:ci
