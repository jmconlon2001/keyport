<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1036" width="1000" height="1036">
  <!-- Keyport logo: mark + wordmark on deep space -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#090d1a" />
    </linearGradient>
    <radialGradient id="nebula-a" cx="82%" cy="30%" r="38%">
      <stop offset="0%" stop-color="#1b5e5a" stop-opacity=".45" />
      <stop offset="55%" stop-color="#1d2f52" stop-opacity=".25" />
      <stop offset="100%" stop-color="#0d1326" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-b" cx="78%" cy="38%" r="18%">
      <stop offset="0%" stop-color="#6b2a4a" stop-opacity=".35" />
      <stop offset="100%" stop-color="#0d1326" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4e0ec" />
      <stop offset="100%" stop-color="#bccddf" />
    </linearGradient>
  </defs>
  <rect width="1000" height="1036" fill="url(#bg)" />
  <rect width="1000" height="1036" fill="url(#nebula-a)" />
  <rect width="1000" height="1036" fill="url(#nebula-b)" />
  <g fill="#ffffff">
    <circle cx="706" cy="128" r="4" opacity=".9" />
    <circle cx="808" cy="164" r="2" opacity=".7" />
    <circle cx="914" cy="204" r="2.5" opacity=".7" />
    <circle cx="134" cy="158" r="1.5" opacity=".5" />
    <circle cx="70" cy="300" r="1.2" opacity=".4" />
    <circle cx="372" cy="520" r="1.5" opacity=".5" />
    <circle cx="880" cy="610" r="1.4" opacity=".5" />
    <circle cx="240" cy="900" r="1.2" opacity=".35" />
  </g>
  <!-- Mark (same geometry as logo-mark.svg, scaled) -->
  <g transform="translate(499 457) scale(5.28) translate(-60 -60)">
    <circle cx="60" cy="60" r="53.1" fill="none" stroke="#1f4a63" stroke-width="5.6" />
    <circle cx="60" cy="60" r="36.9" fill="none" stroke="#b07cf0" stroke-width="8.4" />
    <rect x="45.35" y="54.7" width="29.3" height="15" rx="1.5" fill="url(#card)" transform="rotate(44 60 62.2)" />
  </g>
  <text x="500" y="938" text-anchor="middle" font-family="Montserrat, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" letter-spacing="6">KEYPORT</text>
</svg>
